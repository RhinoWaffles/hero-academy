<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       HERO ACADEMY — DESIGN SYSTEM
       Phase 1: CSS custom properties, base styles, component
       classes. No screen-specific styles yet.
    ========================================================= */

    /* ---------------------------------------------------------
       1. CSS CUSTOM PROPERTIES
    --------------------------------------------------------- */
    :root {
      /* Typography */
      --font-family: 'Nunito', system-ui, sans-serif;
      --font-size-base: 20px;
      --font-size-sm: 16px;
      --font-size-md: 22px;
      --font-size-lg: 26px;
      --font-size-xl: 32px;
      --font-weight-normal: 400;
      --font-weight-semi: 600;
      --font-weight-bold: 700;
      --font-weight-black: 800;
      --line-height-base: 1.6;
      --line-height-tight: 1.3;

      /* Color System — Superhero Theme (default) */
      --color-bg:             #0F1B2D;
      --color-surface:        #1A2E45;
      --color-surface-hi:     #243B55;
      --color-border:         #2E4A6A;
      --color-accent-gold:    #FFD700;
      --color-accent-blue:    #4FC3F7;
      --color-success:        #66BB6A;
      --color-warning:        #FFA726;
      --color-text-primary:   #F5F5F5;
      --color-text-secondary: #B0BEC5;
      --color-text-on-gold:   #0F1B2D;

      /* Spacing — base unit 8px */
      --space-1: 8px;
      --space-2: 16px;
      --space-3: 24px;
      --space-4: 32px;
      --space-5: 40px;
      --space-6: 48px;

      /* Border Radius */
      --radius-sm:   8px;
      --radius-md:   12px;
      --radius-lg:   20px;
      --radius-xl:   28px;
      --radius-full: 9999px;

      /* Shadows */
      --shadow-card:      0 4px 24px rgba(0,0,0,0.4);
      --shadow-button:    0 4px 12px rgba(0,0,0,0.3);
      --shadow-glow-gold: 0 0 20px rgba(255,215,0,0.3);

      /* Transitions */
      --transition-fast:      150ms ease;
      --transition-base:      200ms ease;
      --transition-slow:      400ms ease;
      --transition-celebrate: 600ms cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ---------------------------------------------------------
       2. REDUCED-MOTION OVERRIDE
    --------------------------------------------------------- */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ---------------------------------------------------------
       3. RESET & BASE
    --------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-size: var(--font-size-base);
    }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-base);
      color: var(--color-text-primary);
      background: var(--color-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ---------------------------------------------------------
       4. APP MOUNT POINT
    --------------------------------------------------------- */
    #app {
      width: 100vw;
      min-height: 100vh;
      background: var(--color-bg);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      color: var(--color-text-primary);
      line-height: var(--line-height-base);
    }

    /* ---------------------------------------------------------
       5. SCREEN WRAPPER
    --------------------------------------------------------- */
    .screen {
      max-width: 860px;
      margin: 0 auto;
      padding: var(--space-4);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ---------------------------------------------------------
       6. TYPOGRAPHY UTILITIES
    --------------------------------------------------------- */
    h1 {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-black);
      line-height: var(--line-height-tight);
    }

    h2 {
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
    }

    h3 {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
      line-height: var(--line-height-tight);
    }

    p {
      font-size: var(--font-size-base);
      line-height: var(--line-height-base);
    }

    .text-gold    { color: var(--color-accent-gold); }
    .text-blue    { color: var(--color-accent-blue); }
    .text-success { color: var(--color-success); }
    .text-warning { color: var(--color-warning); }
    .text-secondary { color: var(--color-text-secondary); font-size: var(--font-size-sm); }
    .text-italic  { font-style: italic; }
    .text-bold    { font-weight: var(--font-weight-bold); }
    .text-center  { text-align: center; }

    /* ---------------------------------------------------------
       7. SURFACE / CARD
    --------------------------------------------------------- */
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      box-shadow: var(--shadow-card);
    }

    .card-hi {
      background: var(--color-surface-hi);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      box-shadow: var(--shadow-card);
    }

    /* ---------------------------------------------------------
       8. BUTTONS
    --------------------------------------------------------- */

    /* Base reset for all buttons */
    button {
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-bold);
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      text-decoration: none;
      transition:
        transform var(--transition-fast),
        box-shadow var(--transition-fast),
        background var(--transition-fast),
        border-color var(--transition-fast);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* Primary — gold */
    .btn-primary {
      background: var(--color-accent-gold);
      color: var(--color-text-on-gold);
      min-height: 56px;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-button);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
      box-shadow: var(--shadow-button);
    }

    .btn-primary:focus-visible {
      outline: 3px solid var(--color-accent-gold);
      outline-offset: 3px;
    }

    /* Primary full-width variant */
    .btn-primary-full {
      width: 100%;
    }

    /* Secondary — outlined blue */
    .btn-secondary {
      background: transparent;
      color: var(--color-accent-blue);
      border: 2px solid var(--color-accent-blue);
      min-height: 56px;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--radius-md);
    }

    .btn-secondary:hover:not(:disabled) {
      transform: translateY(-2px);
      background: rgba(79, 195, 247, 0.08);
    }

    .btn-secondary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-secondary:focus-visible {
      outline: 3px solid var(--color-accent-blue);
      outline-offset: 3px;
    }

    .btn-secondary-full {
      width: 100%;
    }

    /* Ghost / text link style */
    .btn-link {
      background: none;
      border: none;
      color: var(--color-accent-blue);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semi);
      text-decoration: underline;
      text-underline-offset: 3px;
      min-height: 40px;
      padding: var(--space-1) var(--space-1);
    }

    .btn-link:hover:not(:disabled) {
      color: var(--color-text-primary);
    }

    .btn-link:focus-visible {
      outline: 3px solid var(--color-accent-blue);
      outline-offset: 3px;
      border-radius: var(--radius-sm);
    }

    /* ---------------------------------------------------------
       9. ANSWER TILES
    --------------------------------------------------------- */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-2);
    }

    .answer-tile {
      background: var(--color-surface-hi);
      border: 2px solid var(--color-border);
      color: var(--color-text-primary);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-semi);
      min-height: 80px;
      border-radius: var(--radius-md);
      width: 100%;
      padding: var(--space-2);
      text-align: center;
      cursor: pointer;
      transition:
        border-color var(--transition-fast),
        background var(--transition-fast);
    }

    .answer-tile:hover:not(:disabled) {
      border-color: rgba(79, 195, 247, 0.5);
    }

    .answer-tile.selected {
      border-color: var(--color-accent-blue);
      background: rgba(79, 195, 247, 0.12);
    }

    .answer-tile.correct {
      border-color: var(--color-success);
      background: rgba(102, 187, 106, 0.15);
    }

    .answer-tile.incorrect {
      border-color: var(--color-warning);
      background: rgba(255, 167, 38, 0.10);
    }

    .answer-tile:focus-visible {
      outline: 3px solid var(--color-accent-blue);
      outline-offset: 3px;
    }

    /* ---------------------------------------------------------
       10. PROGRESS BAR
    --------------------------------------------------------- */
    .progress-bar-track {
      width: 100%;
      height: 16px;
      background: var(--color-surface-hi);
      border-radius: var(--radius-full);
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--color-accent-gold);
      border-radius: var(--radius-full);
      transition: width var(--transition-slow);
    }

    /* Thin variant for question progress */
    .progress-bar-thin {
      height: 6px;
    }

    /* ---------------------------------------------------------
       11. TOP BAR
    --------------------------------------------------------- */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 56px;
      padding: var(--space-1) 0;
      margin-bottom: var(--space-3);
    }

    .top-bar-title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-primary);
    }

    .pp-counter {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-black);
      color: var(--color-accent-gold);
    }

    /* ---------------------------------------------------------
       12. DOT PROGRESS INDICATOR
    --------------------------------------------------------- */
    .dot-row {
      display: flex;
      gap: var(--space-1);
      align-items: center;
      flex-wrap: wrap;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: var(--radius-full);
      background: var(--color-border);
      transition: background var(--transition-base);
    }

    .dot.filled {
      background: var(--color-accent-gold);
    }

    /* ---------------------------------------------------------
       13. COLOR SWATCHES (onboarding)
    --------------------------------------------------------- */
    .swatch-group {
      display: flex;
      gap: var(--space-2);
      flex-wrap: wrap;
    }

    .swatch {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-full);
      border: 3px solid transparent;
      cursor: pointer;
      transition:
        transform var(--transition-fast),
        border-color var(--transition-fast);
    }

    .swatch:hover {
      transform: scale(1.1);
    }

    .swatch.selected {
      border-color: var(--color-text-primary);
      transform: scale(1.1);
      box-shadow: 0 0 0 3px var(--color-surface);
    }

    .swatch:focus-visible {
      outline: 3px solid var(--color-accent-gold);
      outline-offset: 3px;
    }

    /* ---------------------------------------------------------
       14. TEXT INPUT
    --------------------------------------------------------- */
    .text-input {
      font-family: var(--font-family);
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semi);
      color: var(--color-text-primary);
      background: var(--color-surface-hi);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      min-height: 56px;
      padding: var(--space-1) var(--space-2);
      width: 100%;
      transition: border-color var(--transition-fast);
    }

    .text-input::placeholder {
      color: var(--color-text-secondary);
    }

    .text-input:focus {
      outline: none;
      border-color: var(--color-accent-blue);
    }

    /* Numeric input variant */
    .num-input {
      width: 120px;
      font-size: var(--font-size-lg);
      text-align: center;
      -moz-appearance: textfield;
    }

    .num-input::-webkit-outer-spin-button,
    .num-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
    }

    /* ---------------------------------------------------------
       15. FEEDBACK CARD (slide-up)
    --------------------------------------------------------- */
    .feedback-card {
      border-radius: var(--radius-md);
      padding: var(--space-3);
      margin-top: var(--space-2);
      animation: slideUp var(--transition-base) both;
    }

    .feedback-card.correct {
      background: rgba(102, 187, 106, 0.15);
      border: 1px solid var(--color-success);
    }

    .feedback-card.incorrect {
      background: rgba(255, 167, 38, 0.10);
      border: 1px solid var(--color-warning);
    }

    /* ---------------------------------------------------------
       16. BADGE TILE
    --------------------------------------------------------- */
    .badge-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: var(--space-2);
    }

    .badge-tile {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      width: 100%;
      aspect-ratio: 5 / 6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-1);
      cursor: pointer;
      transition: transform var(--transition-fast);
      padding: var(--space-1);
    }

    .badge-tile:hover {
      transform: translateY(-2px);
    }

    .badge-tile .badge-emoji {
      font-size: 40px;
      line-height: 1;
    }

    .badge-tile .badge-name {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semi);
      text-align: center;
      color: var(--color-text-primary);
    }

    .badge-tile.locked {
      opacity: 0.5;
      cursor: default;
    }

    /* ---------------------------------------------------------
       17. DRAG-ORDER TILES
    --------------------------------------------------------- */
    .drag-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-1);
    }

    .drag-tile {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: var(--color-surface-hi);
      border: 2px solid var(--color-border);
      border-radius: var(--radius-md);
      min-height: 56px;
      padding: var(--space-1) var(--space-2);
      cursor: grab;
      font-size: var(--font-size-base);
      transition: border-color var(--transition-fast), opacity var(--transition-fast);
    }

    .drag-tile:active {
      cursor: grabbing;
      opacity: 0.75;
    }

    .drag-handle {
      font-size: 24px;
      color: var(--color-text-secondary);
      flex-shrink: 0;
      pointer-events: none;
    }

    .drag-tile.drag-over {
      border-color: var(--color-accent-blue);
      background: rgba(79, 195, 247, 0.08);
    }

    .drag-tile.dragging {
      opacity: 0.45;
    }

    .drag-tile.correct {
      border-color: var(--color-success);
      background: rgba(102, 187, 106, 0.15);
      cursor: default;
    }

    .drag-tile.incorrect {
      border-color: var(--color-warning);
      background: rgba(255, 167, 38, 0.10);
      cursor: default;
    }

    /* ---------------------------------------------------------
       17b. SENTENCE SELECT TILES
    --------------------------------------------------------- */
    .sentence-list {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .sentence-tile {
      background: var(--color-surface-hi);
      border: 2px solid var(--color-border);
      color: var(--color-text-primary);
      font-family: var(--font-family);
      font-size: var(--font-size-base);
      font-weight: var(--font-weight-normal);
      line-height: var(--line-height-base);
      min-height: 56px;
      border-radius: var(--radius-md);
      width: 100%;
      padding: var(--space-2) var(--space-3);
      text-align: left;
      cursor: pointer;
      transition:
        border-color var(--transition-fast),
        background var(--transition-fast);
    }

    .sentence-tile:hover:not(:disabled) {
      border-color: rgba(79, 195, 247, 0.5);
    }

    .sentence-tile.selected {
      border-color: var(--color-accent-blue);
      background: rgba(79, 195, 247, 0.12);
    }

    .sentence-tile.correct {
      border-color: var(--color-success);
      background: rgba(102, 187, 106, 0.15);
    }

    .sentence-tile.incorrect {
      border-color: var(--color-warning);
      background: rgba(255, 167, 38, 0.10);
    }

    .sentence-tile:focus-visible {
      outline: 3px solid var(--color-accent-blue);
      outline-offset: 3px;
    }

    /* ---------------------------------------------------------
       18. PASSAGE BOX
    --------------------------------------------------------- */
    .passage-box {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      padding: var(--space-3);
      max-height: 45vh;
      overflow-y: auto;
      margin-bottom: var(--space-3);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border) transparent;
    }

    .passage-box::-webkit-scrollbar { width: 6px; }
    .passage-box::-webkit-scrollbar-track { background: transparent; }
    .passage-box::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }

    .passage-title {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
      margin-bottom: var(--space-2);
      color: var(--color-accent-gold);
    }

    .passage-text {
      font-size: var(--font-size-base);
      line-height: var(--line-height-base);
      color: var(--color-text-primary);
    }

    /* ---------------------------------------------------------
       19. HERO AVATAR (pulsing glow — onboarding)
    --------------------------------------------------------- */
    .hero-avatar {
      font-size: 80px;
      display: block;
      text-align: center;
      animation: heroGlow 2.5s ease-in-out infinite;
    }

    @keyframes heroGlow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(255,215,0,0.2)); }
      50%       { filter: drop-shadow(0 0 24px rgba(255,215,0,0.7)); }
    }

    /* ---------------------------------------------------------
       20. CELEBRATE / SLIDE-UP ANIMATIONS
    --------------------------------------------------------- */
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(-30px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }

    @keyframes celebrate {
      0%   { transform: scale(0.6); opacity: 0; }
      70%  { transform: scale(1.05); }
      100% { transform: scale(1);   opacity: 1; }
    }

    @keyframes countUp {
      from { transform: scale(1.4); color: var(--color-accent-gold); }
      to   { transform: scale(1);   color: var(--color-accent-gold); }
    }

    .animate-slide-up   { animation: slideUp   var(--transition-base)      both; }
    .animate-slide-in   { animation: slideIn   var(--transition-slow)       both; }
    .animate-celebrate  { animation: celebrate var(--transition-celebrate)  both; }

    /* ---------------------------------------------------------
       21. SPACER UTILITIES
    --------------------------------------------------------- */
    .mt-1 { margin-top: var(--space-1); }
    .mt-2 { margin-top: var(--space-2); }
    .mt-3 { margin-top: var(--space-3); }
    .mt-4 { margin-top: var(--space-4); }
    .mb-1 { margin-bottom: var(--space-1); }
    .mb-2 { margin-bottom: var(--space-2); }
    .mb-3 { margin-bottom: var(--space-3); }
    .mb-4 { margin-bottom: var(--space-4); }

    .flex-row {
      display: flex;
      flex-direction: row;
      gap: var(--space-2);
    }

    .flex-col {
      display: flex;
      flex-direction: column;
      gap: var(--space-2);
    }

    .flex-1 { flex: 1; }
    .spacer { flex: 1; }

    /* ---------------------------------------------------------
       22. DIVIDER
    --------------------------------------------------------- */
    .divider {
      height: 1px;
      background: var(--color-border);
      margin: var(--space-3) 0;
    }

    /* ---------------------------------------------------------
       23. MODAL OVERLAY
    --------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: var(--space-4);
    }

    .modal {
      background: var(--color-surface-hi);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      max-width: 480px;
      width: 100%;
      box-shadow: var(--shadow-card);
      animation: celebrate var(--transition-celebrate) both;
    }

    /* ---------------------------------------------------------
       24. STAR RATING
    --------------------------------------------------------- */
    .star-rating {
      font-size: var(--font-size-lg);
      letter-spacing: 4px;
      color: var(--color-accent-gold);
    }

    /* ---------------------------------------------------------
       25. SECTION HEADER
    --------------------------------------------------------- */
    .section-header {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-bold);
      color: var(--color-text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: var(--space-2);
    }

    /* ---------------------------------------------------------
       26. LOADING / INIT PLACEHOLDER
    --------------------------------------------------------- */
    #app:empty::after {
      content: '⚡';
      display: block;
      font-size: 64px;
      text-align: center;
      padding-top: 40vh;
      animation: heroGlow 1.5s ease-in-out infinite;
    }

    /* ---------------------------------------------------------
       27. ONBOARDING SCREEN
    --------------------------------------------------------- */
    .onboarding-logo {
      font-size: var(--font-size-xl);
      font-weight: var(--font-weight-black);
      color: var(--color-accent-gold);
      text-shadow: 0 0 20px rgba(255,215,0,0.4);
    }

    .onboarding-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
      max-width: 480px;
      margin: 0 auto;

            'text-evidence': {
              explanation: 'Text evidence means using words from the story to prove your answer. When a question asks how you know something, go back to the text and find the sentence that shows it. Good readers always check the text before choosing an answer.',

            },
            'point-of-view': {
              explanation: 'Point of view tells you WHO is telling the story. When a story uses "I," "me," or "my," the narrator is a character inside the story — that is called first-person. When the story uses "he," "she," or "they," someone outside is telling it — that is called third-person. Knowing the point of view helps you understand whose feelings and thoughts you are reading.',

tures survive helps scientists understand the limits of life — and imagine how life might exist on other planets with extreme conditions.',

    /**
     * Persist the full player data object to localStorage.
     * Key is always heroAcademy_playerData.
     * @param {Object} data
     */
    function savePlayerData(data) {
      try {
        localStorage.setItem('heroAcademy_playerData', JSON.stringify(data));
      } catch (e) {
        console.error('Hero Academy: save failed:', e);
      }
    }

    /**
     * Load and parse player data from localStorage.
     * Returns parsed object or null if not found / parse error.
     * @returns {Object|null}
     */
    function loadPlayerData() {
      try {
        const raw = localStorage.getItem('heroAcademy_playerData');
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    /* -----------------------------------------------------------
       5. UTILITY HELPERS
    ----------------------------------------------------------- */

    /** Prevent XSS for any user-supplied string rendered as HTML. */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    /** Today's date as YYYY-MM-DD. */
    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    /** Format an ISO date string for human display. */
    function formatDate(isoString) {
      if (!isoString) return 'Never';
      try {
        return new Date(isoString).toLocaleDateString('en-US', {
          month: 'short', day: 'numeric', year: 'numeric',
        });
      } catch (e) {
        return 'Unknown';
      }
    }

    /**
     * Compute rank and PP progress toward the next rank.
     * @param {number} totalPP
     * @returns {{ rank, rankTitle, currentThreshold, nextThreshold, progressPct }}
     */
    function getRankInfo(totalPP) {
      const ranks = THEME.ranks;
      let rank = 1;
      for (let i = 1; i < ranks.length; i++) {
        if (totalPP >= ranks[i].threshold) rank = i;
      }
      rank = Math.min(rank, ranks.length - 1);
      const current = ranks[rank];
      const next    = ranks[rank + 1] ?? null;
      let progressPct = 100;
      if (next) {
        const span   = next.threshold - current.threshold;
        const earned = totalPP - current.threshold;
        progressPct  = Math.min(100, Math.max(0, Math.round((earned / span) * 100)));
      }
      return { rank, rankTitle: current.title, currentThreshold: current.threshold,
               nextThreshold: next ? next.threshold : null, progressPct };
    }

    /**
     * Select today's mission pair: one Math, one ELA.
     * Priority: lowest accuracy → longest since last played → most overdue.
     * Falls back to placeholder objects when CONTENT.missions is empty.
     * @param {Object} playerData
     * @returns {[Object, Object]}  [mathMission, elaMission]
     */
    /**
     * Select today's mission pair: one Math + one ELA.
     * Priority: lowest accuracy, then longest since played.
     * Never repeats the same Math+ELA pair that was played yesterday.
     */
    function selectTodaysMissions(playerData) {
      const ids     = Object.keys(CONTENT.missions);
      const mathIds = ids.filter(id => CONTENT.missions[id].world === 'math');
      const elaIds  = ids.filter(id => CONTENT.missions[id].world === 'ela');

      const placeholder = (world) => world === 'math'
        ? { id: null, emoji: '⚡', name: 'Number Kingdom Training', world: 'math' }
        : { id: null, emoji: '📖', name: 'Word Realm Training',     world: 'ela'  };

      if (!mathIds.length && !elaIds.length) {
        return [placeholder('math'), placeholder('ela')];
      }

      const progress = playerData?.progress ?? {};
      const sessions = playerData?.sessions ?? [];

      // Identify yesterday's pair to avoid repeating it
      const yd = new Date();
      yd.setDate(yd.getDate() - 1);
      const yesterday        = yd.toISOString().slice(0, 10);
      const yesterdaySess    = sessions.filter(s => s.date === yesterday).pop();
      let   yesterdayMathId  = null;
      let   yesterdayElaId   = null;
      if (yesterdaySess?.missionsPlayed) {
        for (const mId of yesterdaySess.missionsPlayed) {
          const m = CONTENT.missions[mId];
          if (!m) continue;
          if (m.world === 'math') yesterdayMathId = mId;
          if (m.world === 'ela')  yesterdayElaId  = mId;
        }
      }

      function score(id) {
        const mission = CONTENT.missions[id];
        const qIds    = (mission.questions ?? []).map(q => q.id);
        let correct = 0, answered = 0;
        for (const qid of qIds) {
          const p = progress[qid];
          if (p) {
            correct  += p.timesCorrect   ?? 0;
            answered += (p.timesCorrect ?? 0) + (p.timesIncorrect ?? 0);
          }
        }
        const accuracy   = answered > 0 ? correct / answered : 0.5;
        const lastPlayed = sessions
          .filter(s => s.missionsPlayed?.includes(id))
          .map(s => s.date).sort().pop() ?? '2000-01-01';
        return { id, accuracy, lastPlayed };
      }

      // Returns mission IDs ranked best→worst (lowest accuracy, then oldest played)
      function rankPool(pool) {
        if (!pool.length) return [];
        return pool.map(score)
          .sort((a, b) =>
            a.accuracy !== b.accuracy
              ? a.accuracy - b.accuracy
              : a.lastPlayed < b.lastPlayed ? -1 : 1
          )
          .map(s => s.id);
      }

      const mathRanked = rankPool(mathIds);
      const elaRanked  = rankPool(elaIds);

      let mathId = mathRanked[0] ?? null;
      let elaId  = elaRanked[0]  ?? null;

      // Never repeat the exact same pair two days in a row
      if (mathId && elaId && mathId === yesterdayMathId && elaId === yesterdayElaId) {
        if (mathRanked.length >= 2) {
          mathId = mathRanked[1];       // prefer second-best math
        } else if (elaRanked.length >= 2) {
          elaId = elaRanked[1];         // fall back to second-best ELA
        }
        // Only one option in both pools — unavoidable repeat, keep best
      }

      return [
        mathId ? CONTENT.missions[mathId] : placeholder('math'),
        elaId  ? CONTENT.missions[elaId]  : placeholder('ela'),
      ];
    }

    /**
     * Return skill health indicator for a given accuracy (0–1 or null).
     * @param {number|null} accuracy
     */
    function skillHealth(accuracy) {
      if (accuracy === null) return { indicator: '⚪', label: 'No data' };
      if (accuracy >= 0.85)  return { indicator: '🟢', label: 'Strong'     };
      if (accuracy >= 0.70)  return { indicator: '🟡', label: 'Good'       };
      return                        { indicator: '🔴', label: 'Needs Work' };
    }

    /**
     * Compute accuracy for a mission from player progress data.
     * @returns {number|null}  float 0–1 or null when no data
     */
    function getMissionAccuracy(missionId, playerData) {
      const mission = CONTENT.missions[missionId];
      if (!mission) return null;
      const progress = playerData?.progress ?? {};
      let correct = 0, total = 0;
      for (const q of mission.questions ?? []) {
        const p = progress[q.id];
        if (p) {
          correct += p.timesCorrect   ?? 0;
          total   += (p.timesCorrect ?? 0) + (p.timesIncorrect ?? 0);
        }
      }
      return total > 0 ? correct / total : null;
    }

    /** Compare two arrays for value equality. */
    function arraysEqual(a, b) {
      return Array.isArray(a) && Array.isArray(b) &&
        a.length === b.length && a.every((v, i) => v === b[i]);
    }

    /** Show a brief success toast at the bottom of the screen. */
    function showToast(message) {
      const toast = document.createElement('div');
      toast.className = 'toast';
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

       6b. PHASE 4 UTILITIES & CONSTANTS
    ----------------------------------------------------------- */

    /** Session block sizes. */
    const WARMUP_SIZE = 10;
    const BLOCK_SIZE  = 12;

    /** Fisher-Yates shuffle — returns a new shuffled array. */
    function shuffle(array) {
      const a = [...array];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    /**
     * Animate a number counting from its current displayed value to `end`.
     * Reads the current value from the element, then counts up with ease-out.
     * @param {string} elementId
     * @param {number} end
     * @param {number} [duration=1200]  milliseconds
     */
    function animateValue(elementId, end, duration) {
      duration = duration || 1200;
      const el = document.getElementById(elementId);
      if (!el) return;
      const startVal  = parseInt(el.textContent.replace(/\D/g, ''), 10) || 0;
      const startTime = performance.now();
      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
      function tick(now) {
        const t = Math.min((now - startTime) / duration, 1);
        el.textContent = Math.round(startVal + (end - startVal) * easeOut(t));
        if (t < 1) requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    /**
     * Update the player's streak based on lastSessionDate.
     * Called at SESSION START — lastSessionDate is updated at session END.
     * @param {Object} data  playerData (mutated in place)
     */
    function updateStreak(data) {
      const today = todayISO();
      const last  = data.player.lastSessionDate;

      if (!last) {
        data.player.currentStreak = 1;
        return;
      }
      if (last === today) {
        return; // already played today, don't increment again
      }

      const d = new Date();
      d.setDate(d.getDate() - 1);
      const yesterday = d.toISOString().slice(0, 10);

      if (last === yesterday) {
        data.player.currentStreak = (data.player.currentStreak || 0) + 1;
      } else {
        data.player.currentStreak = 1; // streak broken
      }
    }

    /**
     * Starting tier for a mission challenge, based on past accuracy.
     * @param {string} missionId
     * @param {Object} data  playerData
     * @returns {number}  1 | 2 | 3
     */
    function getStartingTier(missionId, data) {
      const mission  = CONTENT.missions[missionId];
      if (!mission) return 1;
      const progress = data.progress ?? {};
      const qs       = mission.questions ?? [];

      function tierStats(tier) {
        let answered = 0, correct = 0;
        for (const q of qs.filter(q => q.tier === tier)) {
          const p = progress[q.id];
          if (p) {
            answered += (p.timesCorrect ?? 0) + (p.timesIncorrect ?? 0);
            correct  += p.timesCorrect ?? 0;
          }
        }
        return { answered, accuracy: answered > 0 ? correct / answered : 0 };
      }

      const t1 = tierStats(1);
      if (t1.answered < 10 || t1.accuracy < 0.80) return 1;

      const t2 = tierStats(2);
      if (t2.answered < 20 || t2.accuracy < 0.80) return 2;

      return 3;
    }

    /* -----------------------------------------------------------
       SESSION MANAGEMENT — Phase 4
    ----------------------------------------------------------- */

    /**
     * Select up to `count` warm-up questions from all missions.
     * Warmup focuses on Level 2-3 review (CLAUDE.md §9.1).
     * Within that, questions due for review come first.
     * Falls back through lower mastery levels for fresh accounts.
     * Never repeats a question already seen this session.
     */
    function selectWarmupQuestions(count) {
      const data     = loadPlayerData();
      const progress = data.progress ?? {};
      const seen     = STATE.session.seenThisSession;
      const today    = todayISO();

      const allQs = [];
      for (const mId of Object.keys(CONTENT.missions)) {
        for (const q of (CONTENT.missions[mId].questions ?? [])) {
          allQs.push(q);
        }
      }

      const notSeen = allQs.filter(q => !seen.includes(q.id));

      // Primary (Priority 4): mastery 2-3 due for review — most targeted warm-up
      const m23Due = shuffle(notSeen.filter(q => {
        const p = progress[q.id];
        return p && p.masteryLevel >= 2 && p.nextReview?.slice(0, 10) <= today;
      }));

      // Secondary (Priority 4 cont.): mastery 2-3 not yet due but still good review
      const m23Any = shuffle(notSeen.filter(q => {
        const p = progress[q.id];
        return p && p.masteryLevel >= 2 && !(p.nextReview?.slice(0, 10) <= today);
      }));

      // Fallback 1 (Priority 1): struggling questions — answered before but mastery = 0
      const struggling = shuffle(notSeen.filter(q => {
        const p = progress[q.id];
        return p && p.masteryLevel === 0;
      }));

      // Fallback 2 (Priority 2): mastery 1, due for review
      const dueMid = shuffle(notSeen.filter(q => {
        const p = progress[q.id];
        return p && p.masteryLevel === 1 && p.nextReview?.slice(0, 10) <= today;
      }));

      // Fallback 3 (Priority 3): new — never attempted at all
      const fresh = shuffle(notSeen.filter(q => !progress[q.id]));

      // Build result in priority order, no duplicates
      const result = [];
      const added  = new Set();
      for (const q of [...m23Due, ...m23Any, ...struggling, ...dueMid, ...fresh]) {
        if (!added.has(q.id)) {
          added.add(q.id);
          result.push(q);
          if (result.length >= count) return result;
        }
      }

      // Last resort (Priority 5): any not seen this session
      for (const q of shuffle(notSeen)) {
        if (!added.has(q.id)) {
          added.add(q.id);
          result.push(q);
          if (result.length >= count) return result;
        }
      }

      return result;
    }

    /**
     * Pick the next challenge question from the current mission.
     * Applies the 5-level spaced-repetition priority queue within tiers.
     *
     * Priority queue (per CLAUDE.md §8.2):
     *   1. masteryLevel === 0 AND has a progress entry (struggling, seen before)
     *   2. nextReview <= today AND masteryLevel > 0 (due for review)
     *   3. No progress entry at all (brand new question, never attempted)
     *   4. masteryLevel 2-3 (near-mastered / mastered, not yet due)
     *   5. Any remaining question in the pool
     *
     * Outer loop tries currentTier first, then adjacent tiers.
     * Never serves Tier 3 until 80%+ accuracy on 20+ Tier-2 attempts.
     * Never repeats a question seen this session.
     */
    function selectNextChallengeQuestion() {
      const missionId = STATE.session.currentMissionId;
      const mission   = CONTENT.missions[missionId];
      if (!mission) return null;

      const data     = loadPlayerData();
      const progress = data.progress ?? {};
      const seen     = STATE.session.seenThisSession;
      const today    = todayISO();

      // Tier 3 gate: need 80%+ on 20+ Tier-2 attempts in this mission
      const t2Qs = (mission.questions ?? []).filter(q => q.tier === 2);
      let t2Ans = 0, t2Cor = 0;
      for (const q of t2Qs) {
        const p = progress[q.id];
        if (p) { t2Ans += (p.timesCorrect ?? 0) + (p.timesIncorrect ?? 0); t2Cor += p.timesCorrect ?? 0; }
      }
      const tier3Unlocked = t2Ans >= 20 && (t2Cor / t2Ans) >= 0.80;
      const rawTier       = STATE.session.currentTier;
      const effectiveTier = (rawTier === 3 && !tier3Unlocked) ? 2 : rawTier;

      const allQs      = mission.questions ?? [];
      const tiersToTry = [effectiveTier];
      if (effectiveTier > 1) tiersToTry.push(effectiveTier - 1);
      if (effectiveTier < 3) tiersToTry.push(effectiveTier + 1);

      /**
       * Apply the 5-priority spaced-repetition queue to a pool of unseen questions.
       * Returns the single highest-priority pick, or null if pool is empty.
       */
      function pickFromPool(pool) {
        if (!pool.length) return null;

        // Priority 1: struggling — has been attempted before but masteryLevel is 0
        const p1 = pool.filter(q => progress[q.id] && progress[q.id].masteryLevel === 0);
        if (p1.length) return shuffle(p1)[0];

        // Priority 2: due for review — has progress, mastery > 0, review date reached
        const p2 = pool.filter(q => {
          const p = progress[q.id];
          return p && p.masteryLevel > 0 && p.nextReview?.slice(0, 10) <= today;
        });
        if (p2.length) return shuffle(p2)[0];

        // Priority 3: new — no progress entry (never attempted), from current tier
        const p3 = pool.filter(q => !progress[q.id]);
        if (p3.length) return shuffle(p3)[0];

        // Priority 4: mastery 2-3, not yet due — warm-up review content
        const p4 = pool.filter(q => {
          const p = progress[q.id];
          return p && p.masteryLevel >= 2;
        });
        if (p4.length) return shuffle(p4)[0];

        // Priority 5: any remaining question in the pool
        return shuffle(pool)[0];
      }

      // Try each tier in order, applying the priority queue within each
      for (const t of tiersToTry) {
        const pool = allQs.filter(q => q.tier === t && !seen.includes(q.id));
        const pick = pickFromPool(pool);
        if (pick) return pick;
      }

      // All tier pools exhausted — fall back to any unseen in this mission
      const any = allQs.filter(q => !seen.includes(q.id));
      if (any.length) return pickFromPool(any) ?? shuffle(any)[0];

      // Truly seen every question this session — never block, repeat any
      return shuffle(allQs)[0] ?? null;
    }

    /**
     * After each challenge answer, check if consecutive streaks warrant a tier change.
     * Returns true if tier changed (so we can notify, if desired).
     */
    function adjustAdaptiveDifficulty() {
      const cc  = STATE.session.consecutiveCorrect;
      const ci  = STATE.session.consecutiveIncorrect;
      const cur = STATE.session.currentTier;

      if (cc >= 4 && cur < 3) {
        STATE.session.currentTier         = cur + 1;
        STATE.session.consecutiveCorrect  = 0;
        STATE.session.consecutiveIncorrect = 0;
        return true;
      }
      if (ci >= 2 && cur > 1) {
        STATE.session.currentTier         = cur - 1;
        STATE.session.consecutiveCorrect  = 0;
        STATE.session.consecutiveIncorrect = 0;
        return true;
      }
      return false;
    }

    /**
     * Begin a mission challenge block.
     * @param {number} missionIndex  0 = Math mission, 1 = ELA mission
     */
    function startMissionChallenge(missionIndex) {
      const data     = loadPlayerData();
      const missions = STATE.session.missions;
      const mission  = missions[missionIndex];

      // If the selected mission has no id (placeholder), end session
      if (!mission || !mission.id) {
        endSession();
        return;
      }

      STATE.session.mode                  = 'challenge';
      STATE.session.missionIndex          = missionIndex;
      STATE.session.currentMissionId      = mission.id;
      STATE.session.questionIndex         = 0;
      STATE.session.blockSize             = BLOCK_SIZE;
      STATE.session.correctThisBlock      = 0;
      STATE.session.consecutiveCorrect    = 0;
      STATE.session.consecutiveIncorrect  = 0;
      STATE.session.currentTier           = getStartingTier(mission.id, data);
      STATE.session.lastPerfect           = false;

      if (!STATE.session.missionsPlayed.includes(mission.id)) {
        STATE.session.missionsPlayed.push(mission.id);
      }

      advanceToNextQuestion();
    }

    /**
     * Central "next question" router.
     * Handles warmup → challenge transition and block end detection.
     */
    function advanceToNextQuestion() {
      if (STATE.question.autoAdvanceTimer) {
        clearTimeout(STATE.question.autoAdvanceTimer);
        STATE.question.autoAdvanceTimer = null;
      }

      const mode = STATE.session.mode;

      /* ── WARM-UP ─────────────────────────────────────────── */
      if (mode === 'warmup') {
        const qi      = STATE.session.questionIndex;
        const warmupQs = STATE.session.warmupQuestions;

        if (qi >= warmupQs.length || qi >= WARMUP_SIZE) {
          // Warmup done → start Math mission challenge
          STATE.session.warmupComplete = true;
          startMissionChallenge(0);
          return;
        }

        const q = warmupQs[qi];
        STATE.question.obj           = q;
        STATE.question.selectedIndex = null;
        STATE.question.answered      = false;

        if (!STATE.session.seenThisSession.includes(q.id)) {
          STATE.session.seenThisSession.push(q.id);
        }

        showScreen('screen-question');
        return;
      }

      /* ── CHALLENGE ───────────────────────────────────────── */
      if (mode === 'challenge') {
        const qi      = STATE.session.questionIndex;
        const blkSz   = STATE.session.blockSize;

        if (qi >= blkSz) {
          // Block done — record accuracy and show mission complete
          const acc = blkSz > 0
            ? STATE.session.correctThisBlock / blkSz
            : 0;
          STATE.session.accuracyByMission[STATE.session.currentMissionId] = acc;
          STATE.session.lastPerfect = STATE.session.correctThisBlock === blkSz;

          // Perfect block bonus
          if (STATE.session.lastPerfect) {
            const d = loadPlayerData();
            d.player.totalPP       += PP_VALUES.perfect_mission_block;
            STATE.session.ppEarned += PP_VALUES.perfect_mission_block;
            savePlayerData(d);
          }

          showScreen('screen-mission-complete');
          return;
        }

        const nextQ = selectNextChallengeQuestion();
        if (!nextQ) {
          showScreen('screen-mission-complete');
          return;
        }

        STATE.question.obj           = nextQ;
        STATE.question.selectedIndex = null;
        STATE.question.answered      = false;

        if (!STATE.session.seenThisSession.includes(nextQ.id)) {
          STATE.session.seenThisSession.push(nextQ.id);
        }

        showScreen('screen-question');
        return;
      }
    }

    /**
     * Called when the player starts a session (BEGIN TRAINING).
     * Runs streak update, selects missions, builds warmup queue, shows intro.
     */
    function startSession() {
      const data = loadPlayerData();

      // Streak update (at start; lastSessionDate saved at end)
      updateStreak(data);
      savePlayerData(data);

      // Pick today's missions
      const missions = selectTodaysMissions(data);

      // Reset full session state
      STATE.session.active              = true;
      STATE.session.startTime           = Date.now();
      STATE.session.ppEarned            = 0;
      STATE.session.missions            = missions;
      STATE.session.missionIndex        = 0;
      STATE.session.missionsPlayed      = [];
      STATE.session.accuracyByMission   = {};
      STATE.session.mode                = 'warmup';
      STATE.session.currentMissionId    = null;
      STATE.session.questionIndex       = 0;
      STATE.session.blockSize           = WARMUP_SIZE;
      STATE.session.correctThisBlock    = 0;
      STATE.session.currentTier         = 1;
      STATE.session.consecutiveCorrect  = 0;
      STATE.session.consecutiveIncorrect = 0;
      STATE.session.warmupQuestions     = [];
      STATE.session.warmupComplete      = false;
      STATE.session.warmupCorrect       = 0;
      STATE.session.warmupTotal         = 0;
      STATE.session.seenThisSession     = [];
      STATE.session.hadWrongThisSession = false;
      STATE.session.consecutiveCorrectRun = 0;
      STATE.session.earnedComeback      = false;
      STATE.session.usedTutorAndCorrect = false;
      STATE.session.newBadges           = [];
      STATE.session.rankUp              = null;
      STATE.session.lastPerfect         = false;
      STATE.consecutiveWrongOnConcept   = {};

      // Tutor reset
      STATE.tutor.active          = false;
      STATE.tutor.conceptId       = null;
      STATE.tutor.missionId       = null;
      STATE.tutor.practiceQ       = null;
      STATE.tutor.answeredPractice = false;
      STATE.tutor.selectedIndex   = null;

      // Build warmup queue
      STATE.session.warmupQuestions = selectWarmupQuestions(WARMUP_SIZE);

      // Show warmup intro screen
      showScreen('screen-warmup');
    }

    /* -----------------------------------------------------------
       QUESTION INTERACTIONS — Phase 3
    ----------------------------------------------------------- */

    /** Highlight the selected tile (answer-tile or sentence-tile) and enable CHECK. */
    function handleSelectAnswer(indexStr) {
      if (STATE.question.answered) return;
      const index = parseInt(indexStr, 10);
      STATE.question.selectedIndex = index;

      // Works for both multiple_choice (.answer-tile) and sentence_select (.sentence-tile)
      document.querySelectorAll('.answer-tile, .sentence-tile').forEach((tile, i) => {
        tile.classList.toggle('selected', i === index);
      });

      const checkBtn = document.getElementById('check-btn');
      if (checkBtn) checkBtn.disabled = false;
    }

    /** Evaluate the answer for any question type, award PP, update progress. */
    function handleCheckAnswer() {
      if (STATE.question.answered) return;

      const q    = STATE.question.obj;
      const mode = STATE.session.mode;
      let isCorrect  = false;
      let detailHtml = '';  // extra HTML shown in feedback card on wrong answers

      // ── Type-specific evaluation and DOM feedback ─────────────
      switch (q.type) {

        case 'multiple_choice': {
          if (STATE.question.selectedIndex === null) return;
          const sel = STATE.question.selectedIndex;
          isCorrect = sel === q.correct;
          document.querySelectorAll('.answer-tile').forEach(t => { t.disabled = true; });
          const selTile = document.getElementById('tile-' + sel);
          const corTile = document.getElementById('tile-' + q.correct);
          if (selTile) { selTile.classList.remove('selected'); selTile.classList.add(isCorrect ? 'correct' : 'incorrect'); }
          if (!isCorrect && corTile) corTile.classList.add('correct');
          break;
        }

        case 'numeric_input': {
          const input = document.getElementById('numeric-input');
          if (!input || input.value.trim() === '') return;
          isCorrect = input.value.trim() === String(q.correct);
          input.disabled = true;
          input.style.borderColor = isCorrect
            ? 'var(--color-success)'
            : 'var(--color-warning)';
          if (!isCorrect) {
            detailHtml = `<p style="color:var(--color-text-primary);font-size:var(--font-size-base);margin-top:var(--space-1)">The answer is <strong style="color:var(--color-accent-gold)">${escapeHtml(String(q.correct))}</strong>.</p>`;
          }
          break;
        }

        case 'drag_order': {
          isCorrect = arraysEqual(STATE.dragOrder.currentOrder, q.correct);
          // Freeze tiles and color each by position correctness
          document.querySelectorAll('.drag-tile').forEach((tile, pos) => {
            tile.setAttribute('draggable', 'false');
            tile.style.cursor = 'default';
            tile.classList.add(
              STATE.dragOrder.currentOrder[pos] === q.correct[pos] ? 'correct' : 'incorrect'
            );
          });
          if (!isCorrect) {
            const orderedItems = q.correct.map((idx, n) =>
              `<li style="padding:2px 0">${n + 1}. ${escapeHtml(q.items[idx])}</li>`
            ).join('');
            detailHtml = `<p style="color:var(--color-text-secondary);font-size:var(--font-size-sm);margin-top:var(--space-1);font-weight:var(--font-weight-semi)">CORRECT ORDER:</p><ol style="list-style:none;padding:0;margin-top:4px;font-size:var(--font-size-base);line-height:1.7">${orderedItems}</ol>`;
          }
          break;
        }

        case 'sentence_select': {
          if (STATE.question.selectedIndex === null) return;
          const sel = STATE.question.selectedIndex;
          isCorrect = sel === q.correct;
          document.querySelectorAll('.sentence-tile').forEach(t => { t.disabled = true; });
          const selTile = document.querySelectorAll('.sentence-tile')[sel];
          const corTile = document.querySelectorAll('.sentence-tile')[q.correct];
          if (selTile) { selTile.classList.remove('selected'); selTile.classList.add(isCorrect ? 'correct' : 'incorrect'); }
          if (!isCorrect && corTile) corTile.classList.add('correct');
          break;
        }

        default:
          return;
      }

      STATE.question.answered = true;

      // Disable check button
      const checkBtn = document.getElementById('check-btn');
      if (checkBtn) checkBtn.disabled = true;

      // ── PP award ──────────────────────────────────────────────
      let ppEarned = 0;
      if (isCorrect) {
        if (mode === 'warmup')  ppEarned = PP_VALUES.warmup_correct;
        else if (q.tier === 2)  ppEarned = PP_VALUES.challenge_tier2;
        else if (q.tier === 3)  ppEarned = PP_VALUES.challenge_tier3;
        else                    ppEarned = PP_VALUES.challenge_tier1;
      }

      recordQuestionResult(q.id, isCorrect);

      if (ppEarned > 0) {
        const data = loadPlayerData();
        data.player.totalPP    += ppEarned;
        STATE.session.ppEarned += ppEarned;
        savePlayerData(data);
        const ppDisplay = document.getElementById('pp-display');
        if (ppDisplay) ppDisplay.textContent = '\u26a1 ' + data.player.totalPP + ' PP';
      }

      // ── Session tracking ──────────────────────────────────────
      if (isCorrect) {
        STATE.session.correctThisBlock++;
        STATE.session.consecutiveCorrect++;
        STATE.session.consecutiveCorrectRun++;
        STATE.session.consecutiveIncorrect = 0;

        // Comeback badge: wrong then 5+ correct in a row
        if (STATE.session.hadWrongThisSession && STATE.session.consecutiveCorrectRun >= 5) {
          STATE.session.earnedComeback = true;
        }
        // Reset per-concept wrong counter on correct answer
        if (q.conceptId) STATE.consecutiveWrongOnConcept[q.conceptId] = 0;

        // Warmup stats
        if (mode === 'warmup') STATE.session.warmupCorrect++;

      } else {
        STATE.session.hadWrongThisSession    = true;
        STATE.session.consecutiveCorrect     = 0;
        STATE.session.consecutiveCorrectRun  = 0;
        STATE.session.consecutiveIncorrect++;

        // Track per-concept wrongs (challenge mode only)
        if (q.conceptId && mode === 'challenge') {
          const wrongCount = (STATE.consecutiveWrongOnConcept[q.conceptId] || 0) + 1;
          STATE.consecutiveWrongOnConcept[q.conceptId] = wrongCount;

          // Auto-trigger tutor on 2nd consecutive wrong for same concept
          if (wrongCount >= 2) {
            STATE.consecutiveWrongOnConcept[q.conceptId] = 0;
            if (STATE.question.autoAdvanceTimer) {
              clearTimeout(STATE.question.autoAdvanceTimer);
              STATE.question.autoAdvanceTimer = null;
            }
            STATE.question.autoAdvanceTimer = setTimeout(() => {
              triggerTutorMode(q.conceptId);
            }, 1600);
          }
        }
      }

      // Warmup total
      if (mode === 'warmup') STATE.session.warmupTotal++;

      // Adaptive difficulty (challenge only) — affects next question selection
      if (mode === 'challenge') adjustAdaptiveDifficulty();

      // ── Feedback + auto-advance ───────────────────────────────
      renderAnswerFeedback(isCorrect, ppEarned, q.explanation, detailHtml, q.conceptId);

      // Only set auto-advance if tutor trigger hasn't already set a timer
      if (!STATE.question.autoAdvanceTimer) {
        const delay = isCorrect ? 1800 : 2200;
        STATE.question.autoAdvanceTimer = setTimeout(() => {
          STATE.session.questionIndex++;
          advanceToNextQuestion();
        }, delay);
      }
    }

    /**
     * Write one question result to playerData.progress.
     * Updates masteryLevel and schedules the next review (spaced repetition).
     */
    function recordQuestionResult(questionId, isCorrect) {
      const data = loadPlayerData();
      const now  = new Date().toISOString();

      if (!data.progress[questionId]) {
        data.progress[questionId] = {
          masteryLevel:   0,
          timesCorrect:   0,
          timesIncorrect: 0,
          lastSeen:       now,
          nextReview:     now,
        };
      }

      const p    = data.progress[questionId];
      p.lastSeen = now;

      if (isCorrect) {
        p.timesCorrect++;
        p.masteryLevel = Math.min(3, p.masteryLevel + 1);
        const daysMap  = [0, 1, 3, 7];
        const days     = daysMap[p.masteryLevel] ?? 7;
        p.nextReview   = new Date(Date.now() + days * 86400000).toISOString();
      } else {
        p.timesIncorrect++;
        p.masteryLevel = Math.max(0, p.masteryLevel - 1);
        p.nextReview   = now;
      }

      savePlayerData(data);
    }

    /**
     * Inject the feedback card (with NEXT button) into #feedback-area.
     * @param {boolean} isCorrect
     * @param {number}  ppEarned
     * @param {string}  explanation  — plain text explanation
     * @param {string}  [detailHtml] — optional pre-built HTML (e.g. correct order list)
     * @param {string}  [conceptId]  — concept ID for Ask Coach Hero link
     */
    function renderAnswerFeedback(isCorrect, ppEarned, explanation, detailHtml, conceptId) {
      const area = document.getElementById('feedback-area');
      if (!area) return;

      const checkBtn = document.getElementById('check-btn');
      if (checkBtn) checkBtn.style.display = 'none';

      const ppLine = ppEarned > 0
        ? `<p style="color:var(--color-accent-gold);font-size:var(--font-size-md);font-weight:var(--font-weight-black);margin-top:var(--space-1)">+${ppEarned} Power Points! ⚡</p>`
        : '';
      const detail = detailHtml || '';

      // Show "Ask Coach Hero" link only on wrong answers in challenge mode
      const showCoach = !isCorrect && STATE.session.mode === 'challenge' && conceptId
        && CONTENT.missions[STATE.session.currentMissionId]?.tutorMode?.[conceptId];
      const coachLink = showCoach
        ? `<button class="btn-link" data-action="ask-tutor" data-concept="${escapeHtml(conceptId)}"
              style="color:var(--color-accent-blue);margin-top:var(--space-1)">
            💡 Ask Coach Hero
           </button>`
        : '';

      if (isCorrect) {
        area.innerHTML = `
          <div class="feedback-card correct animate-slide-up">
            <p style="color:var(--color-success);font-size:var(--font-size-md);font-weight:var(--font-weight-bold)">
              ✅ That's right!
            </p>
            ${ppLine}
            <p style="color:var(--color-text-secondary);font-size:var(--font-size-base);margin-top:var(--space-1);line-height:var(--line-height-base)">
              ${escapeHtml(explanation)}
            </p>
            <button class="btn-primary btn-primary-full mt-2" data-action="next-question">
              NEXT →
            </button>
          </div>
        `;
      } else {
        area.innerHTML = `
          <div class="feedback-card incorrect animate-slide-up">
            <p style="color:var(--color-warning);font-size:var(--font-size-md);font-weight:var(--font-weight-bold)">
              Not quite — keep going!
            </p>
            ${detail}
            <p style="color:var(--color-text-primary);font-size:var(--font-size-base);margin-top:var(--space-1);line-height:var(--line-height-base)">
              ${escapeHtml(explanation)}
            </p>
            ${coachLink}
            <button class="btn-primary btn-primary-full mt-2" data-action="next-question">
              NEXT →
            </button>
          </div>
        `;
      }
    }

    /** NEXT → button handler — cancels timer and advances immediately. */
    function handleNextQuestion() {
      if (STATE.question.autoAdvanceTimer) {
        clearTimeout(STATE.question.autoAdvanceTimer);
        STATE.question.autoAdvanceTimer = null;
      }
      STATE.session.questionIndex++;
      advanceToNextQuestion();
    }

    /* -----------------------------------------------------------
       NUMERIC INPUT — post-render init
    ----------------------------------------------------------- */

    /** Wire the numeric input: enable CHECK on input, submit on Enter. */
    function initNumericInput() {
      const input    = document.getElementById('numeric-input');
      const checkBtn = document.getElementById('check-btn');
      if (!input) return;

      input.addEventListener('input', () => {
        if (checkBtn) checkBtn.disabled = input.value.trim() === '';
      });

      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' && input.value.trim() !== '') handleCheckAnswer();
      });

      input.focus();
    }

    /* -----------------------------------------------------------
       DRAG ORDER — post-render init and helpers
    ----------------------------------------------------------- */

    /** Initialize drag state and wire events for a drag_order question. */
    function initDragOrder(q) {
      STATE.dragOrder.currentOrder = q.items.map((_, i) => i);
      STATE.dragOrder.dragFromPos  = null;
      attachDragEvents(q);
    }

    /** Return the innerHTML for all drag tiles given the current order. */
    function buildDragListItems(q) {
      return STATE.dragOrder.currentOrder.map((itemIdx, pos) => `
        <div class="drag-tile" draggable="true" data-pos="${pos}" id="drag-tile-${pos}">
          <span class="drag-handle" aria-hidden="true">☰</span>
          <span>${escapeHtml(q.items[itemIdx])}</span>
        </div>
      `).join('');
    }

    /** Rebuild the drag list and re-attach events after a drop. */
    function rerenderDragList(q) {
      const list = document.getElementById('drag-list');
      if (!list) return;
      list.innerHTML = buildDragListItems(q);
      attachDragEvents(q);
    }

    /** Attach HTML5 drag-and-drop listeners to every .drag-tile in #drag-list. */
    function attachDragEvents(q) {
      const list = document.getElementById('drag-list');
      if (!list) return;

      list.querySelectorAll('.drag-tile').forEach(tile => {
        const pos = parseInt(tile.dataset.pos, 10);

        tile.addEventListener('dragstart', e => {
          STATE.dragOrder.dragFromPos = pos;
          e.dataTransfer.effectAllowed = 'move';
          setTimeout(() => tile.classList.add('dragging'), 0);
        });

        tile.addEventListener('dragend', () => {
          tile.classList.remove('dragging');
          list.querySelectorAll('.drag-tile').forEach(t => t.classList.remove('drag-over'));
        });

        tile.addEventListener('dragover', e => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          list.querySelectorAll('.drag-tile').forEach(t => t.classList.remove('drag-over'));
          tile.classList.add('drag-over');
        });

        tile.addEventListener('dragleave', () => {
          tile.classList.remove('drag-over');
        });

        tile.addEventListener('drop', e => {
          e.preventDefault();
          tile.classList.remove('drag-over');
          const fromPos = STATE.dragOrder.dragFromPos;
          const toPos   = pos;
          if (fromPos === null || fromPos === toPos) return;

          // Lift from source position and insert at destination
          const order = STATE.dragOrder.currentOrder;
          const [moved] = order.splice(fromPos, 1);
          order.splice(toPos, 0, moved);
          STATE.dragOrder.dragFromPos = null;

          rerenderDragList(q);
        });
      });
    }

    function renderWarmup() {
      const data = loadPlayerData();
      const name = data.player.name;

      const app    = document.getElementById('app');
      const screen = document.createElement('div');
      screen.className = 'screen';
      screen.innerHTML = `

          <h2 class="text-gold mt-3">
            Time to warm up, ${escapeHtml(name)}!
          </h2>
          <p class="text-secondary mt-2">
            Let's get those hero powers ready.
          </p>
          <p style="font-size:var(--font-size-sm);color:var(--color-text-secondary);margin-top:var(--space-3)">

    function renderQuestion() {
      const q         = STATE.question.obj;
      const data      = loadPlayerData();
      const mode      = STATE.session.mode;
      const isWarmup  = mode === 'warmup';
      const missionId = STATE.session.currentMissionId;
      const mission   = isWarmup ? null : CONTENT.missions[missionId];
      const idx       = STATE.session.questionIndex;   // 0-based

      // ── Shared: passage block ──────────────────────────────────
      let passageHtml = '';
      if (q.passage) {
        const paragraphs = q.passage.text.split('\n\n').map(para =>
          `<p class="passage-text">${escapeHtml(para)}</p>`
        ).join('<p style="margin-top:var(--space-2)">');

      // ── Shared: question card text ────────────────────────────

      // ── Type-specific input area ───────────────────────────────

            ${q.sentences.map((sent, i) => `
              <button
                class="sentence-tile"

        progressHtml = `
          <div class="progress-bar-track progress-bar-thin" style="margin-bottom:var(--space-1)">
            <div class="progress-bar-fill" style="width:${pct}%"></div>
          </div>

                     text-align:right;margin-bottom:var(--space-3)">

        <!-- Top bar -->
        <div class="top-bar">
          ${topLeftHtml}
          <span class="pp-counter" id="pp-display">⚡ ${data.player.totalPP} PP</span>
        </div>

        <!-- Progress indicator (dots for warmup, bar for challenge) -->
        ${progressHtml}

        <!-- Optional passage (sentence_select and literary questions) -->
        ${passageHtml}

        <!-- Question card -->
        <div class="card mb-3">
          ${questionBodyHtml}

        <!-- Type-specific input area -->

        <!-- Feedback card slides in here after checking -->
        <div id="feedback-area"></div>

        <div style="flex:1;min-height:var(--space-4)"></div>
      `;

      app.appendChild(screen);

      // ── Post-render initialization (needs DOM to exist) ────────
      if (q.type === 'numeric_input') initNumericInput();
      else if (q.type === 'drag_order') initDragOrder(q);
    }

    function renderMissionComplete() {
      const missionId  = STATE.session.currentMissionId;
      const mission    = CONTENT.missions[missionId];
      const data       = loadPlayerData();
      const correct    = STATE.session.correctThisBlock;
      const total      = STATE.session.blockSize;
      const ppEarned   = STATE.session.ppEarned;
      const acc        = total > 0 ? correct / total : 0;
      const accPct     = Math.round(acc * 100);
      const missionIdx = STATE.session.missionIndex;

      // Star rating
      const stars = acc >= 0.90 ? '⭐⭐⭐' : acc >= 0.70 ? '⭐⭐' : '⭐';

      // Badge progress bar: Bronze = 10 Qs answered in mission
      const mQs = mission?.questions ?? [];
      const prog = data.progress ?? {};
      let mAnswered = 0;
      for (const q of mQs) {
        const p = prog[q.id];
        if (p) mAnswered += (p.timesCorrect??0) + (p.timesIncorrect??0);
      }
      const bronzeTarget = 10;
      const badgeProgress = Math.min(100, Math.round((mAnswered / bronzeTarget) * 100));

    function renderParent() {
      const data     = loadPlayerData();
      const p        = data.player;
      const sessions = data.sessions ?? [];
      const progress = data.progress ?? {};
      const missionIds = Object.keys(CONTENT.missions);

      // --- Last session metadata ---
      const lastSess    = sessions.length ? sessions[sessions.length - 1] : null;
      const lastSessText = lastSess
        ? `Last session: ${formatDate(lastSess.date)}, ${lastSess.durationMinutes ?? 0} minutes`
        : 'No sessions yet';

      // --- Week bar chart (last 7 days including today) ---
      const today = new Date();
      const weekDays = [];
      for (let i = 6; i >= 0; i--) {
        const d   = new Date(today);
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const lbl = d.toLocaleDateString('en-US', { weekday: 'short' }).slice(0, 3);
        const sess = sessions.find(s => s.date === iso);
        weekDays.push({ label: lbl, iso, duration: sess?.durationMinutes ?? 0 });
      }
      const maxDur = Math.max(40, ...weekDays.map(d => d.duration));

      const weekChartHtml = weekDays.map(day => {
        const heightPx  = day.duration > 0 ? Math.max(6, Math.round((day.duration / maxDur) * 84)) : 4;
        const barClass  = day.duration > 0 ? 'week-bar' : 'week-bar empty';
        return `
          <div class="week-bar-col">
            <div class="${barClass}" style="height: ${heightPx}px;" title="${day.duration} min"></div>
            <span class="week-label">${day.label}</span>
          </div>
        `;
      }).join('');

      // --- Skill health rows ---
      const skillRowsHtml = missionIds.length
        ? missionIds.map(id => {
            const m      = CONTENT.missions[id];
            const acc    = getMissionAccuracy(id, data);
            const health = skillHealth(acc);
            const qIds   = (m.questions ?? []).map(q => q.id);
            const answered = qIds.filter(qid => progress[qid]).length;
            const pctText  = acc !== null ? `${Math.round(acc * 100)}%` : '—';
            return `
              <div class="skill-row">
                <span class="skill-name">${m.emoji} ${escapeHtml(m.name)}</span>
                <span title="${health.label}">${health.indicator}</span>
                <span class="skill-pct">${pctText}</span>
                <span class="skill-pct">${answered} Qs</span>
              </div>
            `;
          }).join('')
        : `<p class="text-secondary" style="padding: var(--space-2) 0">
             No missions yet — content coming in the next training update!
           </p>`;

      // --- Focus areas (accuracy < 65% over ≥15 answered questions) ---
      const focusHtml = (() => {
        const flagged = missionIds.filter(id => {
          const m      = CONTENT.missions[id];
          const qIds   = (m.questions ?? []).map(q => q.id);
          const answered = qIds.filter(qid => progress[qid]).length;
          const acc    = getMissionAccuracy(id, data);
          return acc !== null && acc < 0.65 && answered >= 15;
        });
        if (!flagged.length) {
          return `<p class="text-secondary">All areas looking good — keep up the training!</p>`;
        }
        return flagged.map(id => {
          const m   = CONTENT.missions[id];
          const acc = getMissionAccuracy(id, data);
          return `<p style="padding: var(--space-1) 0">
            <strong>${escapeHtml(m.name)}:</strong> He's getting ${Math.round(acc * 100)}% of these right.
            More practice is coming automatically.
          </p>`;
        }).join('');
      })();

      // --- Recent sessions table (last 10, newest first) ---
      const recent = [...sessions].reverse().slice(0, 10);
      const sessionsHtml = recent.length
        ? `<div style="overflow-x: auto">
             <table class="sessions-table">
               <thead>
                 <tr>
                   <th>Date</th><th>Duration</th><th>PP Earned</th><th>Missions</th>
                 </tr>
               </thead>
               <tbody>
                 ${recent.map(s => `
                   <tr>
                     <td>${formatDate(s.date)}</td>
