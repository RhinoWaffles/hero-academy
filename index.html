    /* -----------------------------------------------------------
       BADGE SYSTEM
    ----------------------------------------------------------- */

    /**
     * Find a practice question for Tutor Mode.
     * Same conceptId, tier = max(1, currentTier-1), not yet seen this session.
     * @returns {Object|null}
     */
    function selectPracticeQuestion(missionId, conceptId, tier) {
      const mission = CONTENT.missions[missionId];
      if (!mission) return null;
      const seen    = STATE.session.seenThisSession;
      const pool    = (mission.questions ?? []).filter(q =>
        q.conceptId === conceptId &&
        q.tier <= Math.max(1, tier) &&
        !seen.includes(q.id)
      );
      return pool.length ? shuffle(pool)[0] : null;
    }

    /**
     * Trigger Tutor Mode for a given conceptId.
     * Called automatically (2 consecutive wrongs) or via Ask Coach Hero button.
     * @param {string} conceptId
     */
    function triggerTutorMode(conceptId) {
      const missionId = STATE.session.currentMissionId;
      const mission   = CONTENT.missions[missionId];
      if (!mission?.tutorMode?.[conceptId]) {
        // No tutor content — just advance
        STATE.session.questionIndex++;
        advanceToNextQuestion();
        return;
      }

      const practiceQ = selectPracticeQuestion(
        missionId, conceptId, Math.max(1, STATE.session.currentTier - 1)
      );

      STATE.tutor.active          = true;
      STATE.tutor.conceptId       = conceptId;
      STATE.tutor.missionId       = missionId;
      STATE.tutor.practiceQ       = practiceQ;
      STATE.tutor.answeredPractice = false;
      STATE.tutor.selectedIndex   = null;

      showScreen('screen-tutor');
    }

    /** Handle tile / sentence selection inside the Tutor practice question. */
    function handleTutorSelectAnswer(indexStr) {
      if (STATE.tutor.answeredPractice) return;
      const index = parseInt(indexStr, 10);
      STATE.tutor.selectedIndex = index;

      document.querySelectorAll('#tutor-answer-grid .answer-tile, #tutor-sentence-list .sentence-tile')
        .forEach((tile, i) => tile.classList.toggle('selected', i === index));

      const btn = document.getElementById('tutor-check-btn');
      if (btn) btn.disabled = false;
    }

    /** Evaluate the tutor practice question, award +5 PP, show feedback, then finish. */
    function handleTutorCheckAnswer() {
      if (STATE.tutor.answeredPractice || !STATE.tutor.practiceQ) return;

      const q  = STATE.tutor.practiceQ;
      let isCorrect = false;

      if (q.type === 'multiple_choice') {
        if (STATE.tutor.selectedIndex === null) return;
        isCorrect = STATE.tutor.selectedIndex === q.correct;
        document.querySelectorAll('#tutor-answer-grid .answer-tile').forEach((t, i) => {
          t.disabled = true;
          if (i === STATE.tutor.selectedIndex) t.classList.add(isCorrect ? 'correct' : 'incorrect');
          if (!isCorrect && i === q.correct)   t.classList.add('correct');
        });
      } else if (q.type === 'numeric_input') {
        const input = document.getElementById('tutor-numeric-input');
        if (!input || input.value.trim() === '') return;
        isCorrect   = input.value.trim() === String(q.correct);
        input.disabled = true;
        input.style.borderColor = isCorrect ? 'var(--color-success)' : 'var(--color-warning)';
      } else if (q.type === 'sentence_select') {
        if (STATE.tutor.selectedIndex === null) return;
        isCorrect = STATE.tutor.selectedIndex === q.correct;
        document.querySelectorAll('#tutor-sentence-list .sentence-tile').forEach((t, i) => {
          t.disabled = true;
          if (i === STATE.tutor.selectedIndex) t.classList.add(isCorrect ? 'correct' : 'incorrect');
          if (!isCorrect && i === q.correct)   t.classList.add('correct');
        });
      }

      STATE.tutor.answeredPractice = true;
      if (isCorrect) STATE.session.usedTutorAndCorrect = true;

      // Disable check button
      const checkBtn = document.getElementById('tutor-check-btn');
      if (checkBtn) { checkBtn.disabled = true; checkBtn.style.display = 'none'; }

      // Award +5 PP for engaging with Coach Hero
      const data = loadPlayerData();
      data.player.totalPP    += PP_VALUES.tutor_engaged;
      STATE.session.ppEarned += PP_VALUES.tutor_engaged;
      savePlayerData(data);

      // Show feedback in tutor screen
      const feedbackArea = document.getElementById('tutor-feedback-area');
      if (feedbackArea) {
        feedbackArea.innerHTML = isCorrect
          ? `<div class="feedback-card correct animate-slide-up">
               <p style="color:var(--color-success);font-size:var(--font-size-md);font-weight:var(--font-weight-bold)">
                 ✅ That's right! Coach Hero is proud of you!
               </p>
               <p style="color:var(--color-text-secondary);margin-top:var(--space-1);font-size:var(--font-size-base);line-height:var(--line-height-base)">
                 ${escapeHtml(q.explanation)}
               </p>
               <button class="btn-primary btn-primary-full mt-3" data-action="finish-tutor">
                 CONTINUE TRAINING →
               </button>
             </div>`
          : `<div class="feedback-card incorrect animate-slide-up">
               <p style="color:var(--color-warning);font-size:var(--font-size-md);font-weight:var(--font-weight-bold)">
                 Keep working at it — you've got this!
               </p>
               <p style="color:var(--color-text-primary);margin-top:var(--space-1);font-size:var(--font-size-base);line-height:var(--line-height-base)">
                 ${escapeHtml(q.explanation)}
               </p>
               <button class="btn-primary btn-primary-full mt-3" data-action="finish-tutor">
                 CONTINUE TRAINING →
               </button>
             </div>`;
      }
    }

    /**
     * Finish Tutor Mode and advance past the original wrong question.
     * Always called after the tutor practice flow (right or wrong).
     */
    function finishTutor() {
      STATE.tutor.active          = false;
      STATE.tutor.practiceQ       = null;
      STATE.tutor.answeredPractice = false;

      // Advance past the original wrong question and continue
      STATE.session.questionIndex++;
      advanceToNextQuestion();
    }

    /**
     * Check all badge criteria against current playerData.
     * Returns array of newly earned badge objects (id, name, emoji, desc).
     * Does NOT modify playerData — caller must push badge IDs and save.
     * @param {Object} data  the CURRENT playerData (with totalPP/sessions already updated)
     * @returns {Array}
     */
    function checkAndAwardBadges(data) {
      const alreadyEarned = new Set(data.player.badges);
      const newBadges     = [];

      function award(id) {
        if (!alreadyEarned.has(id) && BADGE_DEFS[id]) {
          newBadges.push({ id, ...BADGE_DEFS[id] });
          alreadyEarned.add(id); // prevent duplicate within this check
        }
      }

      // ── Streak badges ──────────────────────────────────────────
      const streak = data.player.currentStreak;
      if (streak >= 1)  award('streak-1');
      if (streak >= 3)  award('streak-3');
      if (streak >= 7)  award('streak-7');
      if (streak >= 14) award('streak-14');
      if (streak >= 30) award('streak-30');

      // ── Milestone: total questions answered ────────────────────
      const progress = data.progress ?? {};
      let totalAnswered = 0;
      for (const qid of Object.keys(progress)) {
        const pr = progress[qid];
        totalAnswered += (pr.timesCorrect ?? 0) + (pr.timesIncorrect ?? 0);
      }
      if (totalAnswered >= 100) award('milestone-100');
      if (totalAnswered >= 500) award('milestone-500');

      // ── Mission badges (bronze / silver / gold) ────────────────
      let goldEarnedThisCheck = false;
      for (const missionId of Object.keys(CONTENT.missions)) {
        const mission  = CONTENT.missions[missionId];
        const mQs      = mission.questions ?? [];
        let mAns = 0, mCor = 0, mTier3 = 0;
        for (const q of mQs) {
          const pr = progress[q.id];
          if (pr) {
            mAns += (pr.timesCorrect ?? 0) + (pr.timesIncorrect ?? 0);
            mCor += pr.timesCorrect ?? 0;
            if (q.tier === 3 && (pr.timesCorrect ?? 0) > 0) mTier3++;
          }
        }
        const mAcc = mAns > 0 ? mCor / mAns : 0;

        if (mAns >= 10)                           award(`${missionId}-bronze`);
        if (mAns >= 20 && mAcc >= 0.75)           award(`${missionId}-silver`);
        if (mAns >= 30 && mAcc >= 0.90 && mTier3 >= 5) {
          const goldId = `${missionId}-gold`;
          if (!alreadyEarned.has(goldId)) goldEarnedThisCheck = true;
          award(goldId);
        }
      }

      // First gold badge milestone
      if (goldEarnedThisCheck) award('milestone-first-gold');

      // ── Comeback badges ────────────────────────────────────────
      if (STATE.session.earnedComeback)      award('comeback-bounce');
      if (STATE.session.usedTutorAndCorrect) award('comeback-tutor');

      // Never Quit: completed session after warmup < 50%
      const wTotal = STATE.session.warmupTotal;
      const wCor   = STATE.session.warmupCorrect;
      if (wTotal >= 5 && wCor / wTotal < 0.50) award('comeback-finish');

      return newBadges;
    }

    /**
     * Finalize the session: award bonuses, check badges, check rank-up, save, show victory.
     */
    function endSession() {
      // Cancel any pending auto-advance
      if (STATE.question.autoAdvanceTimer) {
        clearTimeout(STATE.question.autoAdvanceTimer);
        STATE.question.autoAdvanceTimer = null;
      }

      const data = loadPlayerData();

      // ── Session completion bonus ───────────────────────────────
      data.player.totalPP    += PP_VALUES.session_complete;
      STATE.session.ppEarned += PP_VALUES.session_complete;

      // ── Streak bonus (× streak days, capped at 50) ─────────────
      const streakBonus = Math.min(data.player.currentStreak * PP_VALUES.streak_bonus, 50);
      if (streakBonus > 0) {
        data.player.totalPP    += streakBonus;
        STATE.session.ppEarned += streakBonus;
      }

      // ── Save lastSessionDate + session count ──────────────────
      data.player.lastSessionDate  = todayISO();
      data.player.sessionsCompleted = (data.player.sessionsCompleted || 0) + 1;

      // ── Badge check ────────────────────────────────────────────
      const newBadges = checkAndAwardBadges(data);
      for (const badge of newBadges) {
        data.player.badges.push(badge.id);
        data.player.totalPP    += PP_VALUES.badge_earned;
        STATE.session.ppEarned += PP_VALUES.badge_earned;
      }
      STATE.session.newBadges = newBadges;

      // ── Rank advancement ───────────────────────────────────────
      const oldRank = data.player.rank;
      const { rank: newRank } = getRankInfo(data.player.totalPP);
      if (newRank > oldRank) {
        data.player.rank        = newRank;
        data.player.totalPP    += PP_VALUES.rank_up_bonus;
        STATE.session.ppEarned += PP_VALUES.rank_up_bonus;
        STATE.session.rankUp    = { from: oldRank, to: newRank };
      }

      // ── Session record ─────────────────────────────────────────
      const durationMs  = Date.now() - (STATE.session.startTime || Date.now());
      const durationMin = Math.max(1, Math.round(durationMs / 60000));
      const record = {
        date:            todayISO(),
        durationMinutes: durationMin,
        ppEarned:        STATE.session.ppEarned,
        missionsPlayed:  STATE.session.missionsPlayed,
        accuracyByMission: STATE.session.accuracyByMission,
      };
      data.sessions.push(record);
      if (data.sessions.length > 90) data.sessions = data.sessions.slice(-90);

      savePlayerData(data);

      showScreen('screen-victory');
    }

    /* -----------------------------------------------------------
       PIN PROMPT — shown as overlay on top of the dashboard.
       Correct PIN → showScreen('screen-parent').
    ----------------------------------------------------------- */
    function showPinPrompt() {
      const data       = loadPlayerData();
      const correctPin = data?.settings?.parentPin ?? '1234';
      let entered      = '';

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);

      function render() {
        overlay.innerHTML = `
          <div class="modal" style="text-align: center;">
            <h2 style="margin-bottom: var(--space-2)">Parent View</h2>
            <p class="text-secondary" style="margin-bottom: var(--space-3)">Enter your 4-digit PIN</p>
            <div class="pin-dots">
              ${[0,1,2,3].map(i =>
                `<div class="pin-dot ${i < entered.length ? 'filled' : ''}"></div>`
              ).join('')}
            </div>
            <div class="pin-error" id="pin-error"></div>
            <div class="pin-pad">
              ${[1,2,3,4,5,6,7,8,9].map(n =>
                `<button class="pin-btn" data-pin="${n}">${n}</button>`
              ).join('')}
              <button class="pin-btn pin-delete" data-pin-del aria-label="Delete">⌫</button>
              <button class="pin-btn" data-pin="0">0</button>
              <button class="pin-btn pin-ghost" data-pin-cancel>Cancel</button>
            </div>
          </div>
        `;
      }

      render();

      overlay.addEventListener('click', e => {
        const btn = e.target.closest('[data-pin], [data-pin-del], [data-pin-cancel]');
        if (!btn) return;

        if (btn.hasAttribute('data-pin-cancel')) { overlay.remove(); return; }

        if (btn.hasAttribute('data-pin-del')) {
          entered = entered.slice(0, -1);
          render();
          return;
        }

        if (entered.length >= 4) return;
        entered += btn.dataset.pin;
        render();

        if (entered.length === 4) {
          if (entered === correctPin) {
            overlay.remove();
            showScreen('screen-parent');
          } else {
            const errEl = overlay.querySelector('#pin-error');
            errEl.textContent = 'Incorrect PIN — try again.';
            errEl.classList.remove('shake');
            void errEl.offsetWidth;            // reflow to restart animation
            errEl.classList.add('shake');
            setTimeout(() => { entered = ''; render(); }, 950);
          }
        }
      });
    }

    /* -----------------------------------------------------------
       CHANGE PIN FLOW — three-step PIN modal (current → new → confirm).
    ----------------------------------------------------------- */
    function showChangePinFlow() {
      const data       = loadPlayerData();
      const currentPin = data?.settings?.parentPin ?? '1234';
      let step         = 'current';   // 'current' | 'new' | 'confirm'
      let newPinFirst  = '';
      let entered      = '';

      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);

      const prompts = {
        current: 'Enter your current PIN',
        new:     'Enter your new PIN',
        confirm: 'Confirm your new PIN',
      };

      function render() {
        overlay.innerHTML = `
          <div class="modal" style="text-align: center;">
            <h2 style="margin-bottom: var(--space-2)">Change PIN</h2>
            <p class="text-secondary" style="margin-bottom: var(--space-3)">${prompts[step]}</p>
            <div class="pin-dots">
              ${[0,1,2,3].map(i =>
                `<div class="pin-dot ${i < entered.length ? 'filled' : ''}"></div>`
              ).join('')}
            </div>
            <div class="pin-error" id="pin-error"></div>
            <div class="pin-pad">
              ${[1,2,3,4,5,6,7,8,9].map(n =>
                `<button class="pin-btn" data-pin="${n}">${n}</button>`
              ).join('')}
              <button class="pin-btn pin-delete" data-pin-del aria-label="Delete">⌫</button>
              <button class="pin-btn" data-pin="0">0</button>
              <button class="pin-btn pin-ghost" data-pin-cancel>Cancel</button>
            </div>
          </div>
        `;
      }

      render();

      function shake(message) {
        const errEl = overlay.querySelector('#pin-error');
        errEl.textContent = message;
        errEl.classList.remove('shake');
        void errEl.offsetWidth;
        errEl.classList.add('shake');
      }

      overlay.addEventListener('click', e => {
        const btn = e.target.closest('[data-pin], [data-pin-del], [data-pin-cancel]');
        if (!btn) return;

        if (btn.hasAttribute('data-pin-cancel')) { overlay.remove(); return; }

        if (btn.hasAttribute('data-pin-del')) {
          entered = entered.slice(0, -1);
          render();
          return;
        }

        if (entered.length >= 4) return;
        entered += btn.dataset.pin;
        render();

        if (entered.length < 4) return;

        if (step === 'current') {
          if (entered !== currentPin) {
            shake('Incorrect PIN — try again.');
            setTimeout(() => { entered = ''; render(); }, 950);
          } else {
            step = 'new'; entered = ''; render();
          }

        } else if (step === 'new') {
          newPinFirst = entered;
          step = 'confirm'; entered = ''; render();

        } else {
          if (entered !== newPinFirst) {
            shake("PINs don't match — let's try again.");
            setTimeout(() => { step = 'new'; newPinFirst = ''; entered = ''; render(); }, 950);
          } else {
            const fresh = loadPlayerData();
            fresh.settings.parentPin = entered;
            savePlayerData(fresh);
            overlay.remove();
            showToast('✓ PIN updated!');
          }
        }
      });
    }

    /* -----------------------------------------------------------
       8. EVENT DELEGATION
       All data-action clicks bubble here. Screens never wire
       their own navigation — they use data-action attributes.
    ----------------------------------------------------------- */
    document.addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;

      switch (action) {
        /* ── Navigation ──────────────────────────────────────── */
        case 'open-parent':    showPinPrompt();                  break;
        case 'back':           showScreen('screen-dashboard');   break;
        case 'view-missions':  showScreen('screen-mission-map'); break;
        case 'view-badges':    showScreen('screen-badges');      break;
        case 'change-pin':     showChangePinFlow();              break;
        case 'reset-progress': showResetConfirm();               break;

        /* ── Session start ───────────────────────────────────── */
        case 'begin-training': startSession(); break;

        /* ── Question answering ──────────────────────────────── */
        case 'select-answer':  handleSelectAnswer(btn.dataset.index); break;
        case 'check-answer':   handleCheckAnswer();                   break;
        case 'next-question':  handleNextQuestion();                   break;

        /* ── Tutor mode ──────────────────────────────────────── */
        case 'ask-tutor': {
          // User manually requested Coach Hero from wrong-answer feedback
          const conceptId = btn.dataset.concept;
          if (conceptId) {
            // Cancel existing auto-advance / auto-tutor timer
            if (STATE.question.autoAdvanceTimer) {
              clearTimeout(STATE.question.autoAdvanceTimer);
              STATE.question.autoAdvanceTimer = null;
            }
            triggerTutorMode(conceptId);
          }
          break;
        }
        case 'tutor-select':        handleTutorSelectAnswer(btn.dataset.index); break;
        case 'tutor-check-answer':  handleTutorCheckAnswer();                   break;
        case 'finish-tutor':        finishTutor();                              break;

        /* ── Mission complete ────────────────────────────────── */
        case 'next-mission': {
          const nextIdx = STATE.session.missionIndex + 1;
          const nextM   = STATE.session.missions[nextIdx];
          if (nextM && nextM.id) {
            startMissionChallenge(nextIdx);
          } else {
            endSession();
          }
          break;
        }
        case 'take-break':
          endSession();
          break;

        /* ── Victory ─────────────────────────────────────────── */
        case 'done-today':
          STATE.session.active = false;
          showScreen('screen-dashboard');
          break;

        case 'keep-training': {
          // Start another challenge block (pick next priority mission, skip warmup)
          const data      = loadPlayerData();
          const allMIds   = Object.keys(CONTENT.missions);
          const played    = STATE.session.missionsPlayed;
          const remaining = allMIds.filter(id => !played.includes(id));
          const pool      = remaining.length ? remaining : allMIds;

          // Pick the one with lowest accuracy (same priority as selectTodaysMissions)
          function scoreForKeepTraining(id) {
            const acc = getMissionAccuracy(id, data) ?? 0.5;
            return acc;
          }
          pool.sort((a, b) => scoreForKeepTraining(a) - scoreForKeepTraining(b));
          const nextMId = pool[0];

          if (nextMId) {
            // Inject as a fake "extra mission" and start challenge
            STATE.session.missions.push(CONTENT.missions[nextMId]);
            const newIdx = STATE.session.missions.length - 1;
            startMissionChallenge(newIdx);
          } else {
            showScreen('screen-dashboard');
          }
          break;
        }
      }
    });

    /* -----------------------------------------------------------
       10. APP INIT
       Runs once on DOMContentLoaded.
       Decides whether to show onboarding or dashboard.
    ----------------------------------------------------------- */
    document.addEventListener('DOMContentLoaded', () => {
      const data = loadPlayerData();
      if (data === null) {
        showScreen('screen-onboarding');
      } else {
        showScreen('screen-dashboard');
      }
    });
  </script>
</body>
